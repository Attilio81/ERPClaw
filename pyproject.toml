[project]
name = "erpclaw"
version = "0.1.0"
description = "ERP gestito da agente AI via Telegram"
requires-python = ">=3.13"
dependencies = [
    "agno>=2.5.8",
    "aiosqlite>=0.22.1",
    "greenlet>=3.3.2",
    "openai>=2.24.0",
    "python-dotenv>=1.2.2",
    "python-telegram-bot>=22.6",
    "sqlalchemy>=2.0.48",
    "fastapi>=0.115.0",
    "sqladmin>=0.20.0",
    "uvicorn>=0.34.0",
    "itsdangerous>=2.2.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.0,<5.0.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9",
    "ddgs>=9.0.0",
    "pdfplumber>=0.11.0",
]

[tool.uv]
package = true

[project.optional-dependencies]
dev = ["pytest>=9.0"]

[tool.setuptools.packages.find]
include = ["erpclaw*"]

[project.scripts]
erpclaw = "erpclaw.bot:main"
