<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ERPClaw Chat</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://unpkg.com/htmx.org@2.0.3" defer></script>
  <style>
    #chat-box { height: calc(100vh - 180px); overflow-y: auto; }
    .chat-md table { width: 100%; border-collapse: collapse; margin: .5rem 0; }
    .chat-md th, .chat-md td { border: 1px solid #dee2e6; padding: .25rem .5rem; }
    .chat-md th { background: #f8f9fa; }
    .chat-md pre { background: #f8f9fa; padding: .5rem; border-radius: 4px; overflow-x: auto; }
    .htmx-indicator { display: none; }
    .htmx-request .htmx-indicator { display: inline-block; }
  </style>
</head>
<body>
  <nav class="navbar navbar-dark bg-dark mb-0">
    <div class="container-fluid">
      <span class="navbar-brand mb-0 h1">ERPClaw Chat</span>
      <a href="/admin" class="text-light small">Admin →</a>
    </div>
  </nav>

  <div class="container-fluid px-3 pt-3 pb-0" style="max-width: 900px">
    <div id="chat-box" class="border rounded p-3 bg-white mb-2">
      {% include "chat/_messaggi.html" %}
    </div>

    <form id="chat-form"
          hx-post="/chat/send"
          hx-target="#chat-box"
          hx-swap="innerHTML"
          hx-indicator="#spinner"
          hx-on::after-request="this.reset(); this.querySelector('input').focus();"
          class="d-flex gap-2">
      <input type="text" name="message" class="form-control"
             placeholder="Scrivi un messaggio..." autocomplete="off" required autofocus>
      <button type="submit" class="btn btn-primary px-4">
        <span id="spinner" class="htmx-indicator spinner-border spinner-border-sm me-1"></span>
        Invia
      </button>
    </form>
  </div>

  <script>
    // Scroll al fondo dopo ogni swap HTMX (dopo che il DOM è aggiornato)
    document.body.addEventListener('htmx:afterSwap', function(e) {
      if (e.detail.target.id === 'chat-box') {
        e.detail.target.scrollTop = e.detail.target.scrollHeight;
      }
    });
    // Scroll iniziale al fondo se ci sono messaggi da sessioni precedenti
    window.addEventListener('load', function() {
      var box = document.getElementById('chat-box');
      box.scrollTop = box.scrollHeight;
    });
  </script>
</body>
</html>
